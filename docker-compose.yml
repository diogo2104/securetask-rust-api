services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: securetask
      POSTGRES_USER: securetask
      POSTGRES_PASSWORD: securetask
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securetask -d securetask"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgres://securetask:securetask@db:5432/securetask
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET in .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-securetask_api=info,tower_http=info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
